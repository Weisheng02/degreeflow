services:
  - type: web
    name: campus-resource-booking-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://campus-resource-booking-eta.vercel.app
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC
      - key: DATABASE_URL
        fromDatabase:
          name: campus-resource-booking-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: campus-resource-booking-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: campus-resource-booking-db
          property: password

databases:
  - name: campus-resource-booking-db
    plan: free
    region: singapore
    databaseName: campus_booking
    user: campus_booking
    postgresMajorVersion: "17"
    ipAllowList: []
