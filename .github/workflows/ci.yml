name: DegreeFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and build
        working-directory: frontend
        run: npm run lint && npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test student and reviewer workflows
        working-directory: frontend
        run: npm run test:e2e

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: degreeflow
          POSTGRES_USER: degreeflow
          POSTGRES_PASSWORD: degreeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U degreeflow -d degreeflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: prod
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/degreeflow
      DATABASE_USERNAME: degreeflow
      DATABASE_PASSWORD: degreeflow
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend against PostgreSQL 17
        working-directory: backend
        run: ./mvnw --batch-mode verify

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres-integration]
    steps:
      - uses: actions/checkout@v6
      - name: Build application images
        run: docker compose build
