spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:campus_booking}}
spring.datasource.username=${DATABASE_USERNAME:${PGUSER:campus}}
spring.datasource.password=${DATABASE_PASSWORD:${PGPASSWORD:campus}}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
