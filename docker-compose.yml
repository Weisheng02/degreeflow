services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: degreeflow
      POSTGRES_USER: degreeflow
      POSTGRES_PASSWORD: degreeflow
    ports:
      - "5432:5432"
    volumes:
      - degreeflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degreeflow -d degreeflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/degreeflow
      DATABASE_USERNAME: degreeflow
      DATABASE_PASSWORD: degreeflow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  degreeflow_postgres:
